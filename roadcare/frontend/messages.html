<!doctype html><html lang="en"><head><title>Messages - RoadCare</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="/css/roadcare.css" rel="stylesheet"></head><body><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/app.js"></script><script>
(async()=>{await shell('user','messages');main.innerHTML='<h4 class="mb-3">Messages from the maintenance office</h4><div class="row g-3"><div class="col-md-4"><div class="card" id="ls" style="max-height:70vh;overflow:auto"></div></div><div class="col-md-8"><div class="card p-4" id="rd"><span class="text-muted">Select a message to read. Replies are not available; contact the office for urgent matters.</span></div></div></div>';
let items=[];async function load(){const d=await api('/api/messages');items=d.items;ls.innerHTML=items.length?items.map((m,i)=>`<div class="p-3 border-bottom" role="button" data-i="${i}"><div class="d-flex justify-content-between small"><b>${m.announcement?'Announcement':'Maintenance office'}</b>${m.read?'':'<span class="badge bg-danger">New</span>'}</div><div class="small text-truncate">${esc(m.body)}</div><div class="small text-muted">${fmt(m.at)}</div></div>`).join(''):'<div class="p-4 text-muted text-center">No messages.</div>';
 ls.querySelectorAll('[data-i]').forEach(e=>e.onclick=async()=>{const m=items[e.dataset.i];rd.innerHTML=`<div class="small text-muted mb-2">${m.announcement?'Announcement':'Maintenance office'} &middot; ${fmt(m.at)}</div><p style="white-space:pre-wrap">${esc(m.body)}</p>${m.complaint_id?'<a href="/complaint-details.html?id='+m.complaint_id+'">View related complaint</a><br>':''}${m.read?'':'<button class="btn btn-sm btn-outline-secondary mt-2" id="mk">Mark as read</button>'}`;
  document.getElementById('mk')?.addEventListener('click',async()=>{await api('/api/messages/'+m.id+'/read',{method:'POST'});load();rd.innerHTML='<span class="text-muted">Marked as read.</span>'})})}load()})()
</script></body></html>
