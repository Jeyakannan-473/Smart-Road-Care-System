<!doctype html><html lang="en"><head><title>Complaint details - RoadCare</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="/css/roadcare.css" rel="stylesheet"></head><body><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/app.js"></script><script>
(async()=>{const me=await shell('any','');const id=new URLSearchParams(location.search).get('id');let c;try{c=await api('/api/complaints/'+encodeURIComponent(id))}catch(e){main.innerHTML='<div class="alert alert-warning">Complaint not found.</div>';return}
const adm=me.role==='admin',nx={Submitted:['Under Review','Rejected'],'Under Review':['Approved','Rejected'],Approved:['In Progress','Rejected'],'In Progress':['Completed']}[c.status]||[];
main.innerHTML=`<div class="d-flex justify-content-between align-items-center mb-3"><h4 class="mb-0">${esc(c.public_id)}</h4>${badge(c.status)}</div><div class="row g-3"><div class="col-lg-7"><div class="card p-3 mb-3">
<div class="row"><div class="col-md-6">${c.image?'<img class="img-fluid rounded" src="'+c.image+'" alt="Reported damage">':''}<div class="small text-muted mt-1">Reported</div></div><div class="col-md-6">${c.after_image?'<img class="img-fluid rounded" src="'+c.after_image+'" alt="After maintenance"><div class="small text-muted mt-1">After maintenance</div>':''}</div></div>
<dl class="row small mt-3 mb-0"><dt class="col-4">Location</dt><dd class="col-8">${esc(c.location)}, ${esc(c.locality)} ${esc(c.city)}</dd><dt class="col-4">Road type</dt><dd class="col-8">${esc(c.road_type)}</dd><dt class="col-4">Description</dt><dd class="col-8">${esc(c.description)||'-'}</dd>
<dt class="col-4">Assessment</dt><dd class="col-8">${esc(c.category||'Manual review pending')} ${c.severity?'&middot; '+esc(c.severity):''} ${c.confidence?'&middot; '+Math.round(c.confidence*100)+'% confidence':''}${c.needs_review?' <span class="badge bg-warning text-dark">Needs verification</span>':''}<div class="text-muted">Indicative, from a photo only.</div></dd>
<dt class="col-4">Priority</dt><dd class="col-8">${c.priority_score} (${esc(c.priority_category)})</dd>${c.remarks?'<dt class="col-4">Admin remarks</dt><dd class="col-8">'+esc(c.remarks)+'</dd>':''}${c.completed_at?'<dt class="col-4">Completed</dt><dd class="col-8">'+fmt(c.completed_at)+' - '+esc(c.completion_note)+'</dd>':''}</dl></div>
<div class="card p-3"><h6>Progress</h6><div class="tl small">${c.history.map(h=>'<div><b>'+esc(h.to_status)+'</b> <span class="text-muted">'+fmt(h.at)+'</span>'+(h.remark?'<br>'+esc(h.remark):'')+'</div>').join('')}</div></div></div>
<div class="col-lg-5">${adm?`<div class="card p-3 mb-3"><h6>Score breakdown</h6><table class="table table-sm small mb-0">${Object.entries(c.breakdown).map(([k,v])=>'<tr><td class="text-capitalize">'+k+'</td><td class="text-end">'+v+'</td></tr>').join('')}<tr><th>Total</th><th class="text-end">${c.priority_score}</th></tr></table><div class="small text-muted mt-1">Submitted by ${esc(c.owner)} (${esc(c.email)})</div></div>
<div class="card p-3 mb-3"><h6>Verify and assign</h6><input id="cat" class="form-control form-control-sm mb-2" placeholder="Damage category" value="${esc(c.category)}" aria-label="Category"><select id="sev" class="form-select form-select-sm mb-2" aria-label="Severity">${['Low','Medium','High'].map(s=>'<option'+(s===c.severity?' selected':'')+'>'+s+'</option>').join('')}</select><input id="team" class="form-control form-control-sm mb-2" placeholder="Team / department" value="${esc(c.team)}" aria-label="Team"><div class="form-check mb-2"><input class="form-check-input" type="checkbox" id="ver" ${c.verified?'checked':''}><label class="form-check-label" for="ver">Classification verified</label></div><button class="btn btn-rc btn-sm" id="sv">Save</button></div>
${nx.length?`<div class="card p-3 mb-3"><h6>Update status</h6><select id="ns" class="form-select form-select-sm mb-2" aria-label="New status">${nx.map(s=>'<option>'+s+'</option>').join('')}</select><textarea id="rm" class="form-control form-control-sm mb-2" rows="2" placeholder="Remarks (required to reject; completion notes)" aria-label="Remarks"></textarea><button class="btn btn-rc btn-sm" id="us">Apply status</button></div>`:''}
${c.status==='Completed'?`<div class="card p-3"><h6>After-maintenance photo</h6><input type="file" id="af" accept=".jpg,.jpeg,.png" class="form-control form-control-sm mb-2" aria-label="After image"><button class="btn btn-rc btn-sm" id="ub">Upload</button></div>`:''}`:''}</div></div>`;
if(adm){sv.onclick=async()=>{try{await api('/api/admin/complaints/'+c.id+'/assign',{method:'POST',json:{category:cat.value,severity:sev.value,team:team.value,verified:ver.checked}});toast('Saved');location.reload()}catch(e){toast(e.message,false)}};
 window.us&&(us.onclick=async()=>{if(!confirm('Change status to '+ns.value+'? The citizen will be notified.'))return;try{await api('/api/admin/complaints/'+c.id+'/status',{method:'POST',json:{status:ns.value,remark:rm.value,team:team.value,verified:ver.checked}});toast('Status updated');location.reload()}catch(e){toast(e.message,false)}});
 window.ub&&(ub.onclick=async()=>{const fd=new FormData();fd.append('image',af.files[0]||'');try{await api('/api/admin/complaints/'+c.id+'/after-image',{method:'POST',body:fd});toast('Uploaded');location.reload()}catch(e){toast(e.message,false)}})}})()
</script></body></html>
