<!doctype html><html lang="en"><head><title>Operations - RoadCare</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="/css/roadcare.css" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3"></script></head><body><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/app.js"></script>
<script>(async()=>{await shell('admin','admin-dashboard');main.innerHTML=`<h4 class="mb-3">Operations</h4><div class="row g-3 mb-3" id="st"></div><div class="row g-3 mb-3"><div class="col-md-6"><div class="card p-3"><h6>Severity distribution</h6><canvas id="c1" height="140"></canvas></div></div><div class="col-md-6"><div class="card p-3"><h6>Monthly complaints</h6><canvas id="c2" height="140"></canvas></div></div></div>
<div class="card p-3 mb-3"><div class="d-flex justify-content-between"><h6>Complaints</h6><input id="q" class="form-control form-control-sm w-auto" placeholder="Search location" aria-label="Search"></div><div class="table-responsive"><table class="table align-middle small"><thead><tr><th>ID</th><th>Location</th><th>AI result</th><th>Priority</th><th>Status</th><th>Action</th></tr></thead><tbody id="tb"></tbody></table></div></div>
<div class="row g-3"><div class="col-lg-6"><div class="card p-3"><h6>Maintenance queue (C priority queue)</h6><div id="qu" class="small"></div></div></div>
<div class="col-lg-6"><div class="card p-3"><h6>Send message</h6><input id="uq" class="form-control form-control-sm mb-2" placeholder="Search user (blank = announcement to all)" aria-label="User search"><select id="us" class="form-select form-select-sm mb-2"><option value="">All users (announcement)</option></select><textarea id="mb" class="form-control mb-2" rows="3" aria-label="Message"></textarea><button class="btn btn-rc btn-sm" id="ms">Send</button></div></div></div>`;
const ST=await api('/api/admin/stats');st.innerHTML=[['Total',ST.total],['New',ST.by_status['Submitted']],['Under review',ST.by_status['Under Review']],['Approved',ST.by_status['Approved']],['In progress',ST.by_status['In Progress']],['Completed',ST.by_status['Completed']],['Rejected',ST.by_status['Rejected']],['High priority',ST.high_priority]].map(a=>'<div class="col-6 col-md-3"><div class="card stat"><div class="n">'+a[1]+'</div><div class="l">'+a[0]+'</div></div></div>').join('');
new Chart(c1,{type:'doughnut',data:{labels:Object.keys(ST.by_severity),datasets:[{data:Object.values(ST.by_severity),backgroundColor:['#9bd3c8','#13315C','#0B2545']}]}});new Chart(c2,{type:'bar',data:{labels:Object.keys(ST.monthly),datasets:[{label:'Complaints',data:Object.values(ST.monthly),backgroundColor:'#0F9D8A'}]},options:{plugins:{legend:{display:false}}}});
window.load=async()=>{const d=await api('/api/admin/complaints?q='+encodeURIComponent(q.value));tb.innerHTML=d.items.length?d.items.map(c=>`<tr><td>${esc(c.public_id)}</td><td>${esc(c.location)}<br><span class="text-muted">${esc(c.owner)}</span></td><td>${esc(c.category||'Manual review')}<br><span class="text-muted">${esc(c.severity||'')} ${c.confidence?Math.round(c.confidence*100)+'%':''}</span></td><td title="${esc(JSON.stringify(c.breakdown))}">${c.priority_score} ${esc(c.priority_category)}</td><td>${badge(c.status)}</td><td>${c.status==='Completed'||c.status==='Rejected'?'':'<button class="btn btn-sm btn-outline-secondary" onclick="act('+c.id+')">Update</button>'}</td></tr>`).join(''):'<tr><td colspan="6" class="text-muted">No complaints found.</td></tr>';
 const Q=await api('/api/admin/queue').catch(e=>({items:[],error:e.message}));qu.innerHTML=Q.error?'<span class="text-danger">'+esc(Q.error)+'</span>':Q.items.map(i=>'<div class="border-top py-1">#'+i.rank+' '+esc(i.public_id)+' &middot; '+esc(i.location)+' &middot; <b>'+i.priority_score+'</b></div>').join('')||'<span class="text-muted">No approved work in the queue.</span>'};
window.act=async id=>{const c=await api('/api/complaints/'+id),nx={Submitted:['Under Review','Rejected'],'Under Review':['Approved','Rejected'],Approved:['In Progress','Rejected'],'In Progress':['Completed']}[c.status];const s=prompt('Move "'+c.public_id+'" to: '+nx.join(' / '));if(!s||!nx.includes(s))return;const r=prompt('Remarks'+(s==='Rejected'?' (reason required)':'')+':')||'';if(!confirm('Confirm: '+c.status+' -> '+s+'?'))return;
 try{await api('/api/admin/complaints/'+id+'/status',{method:'POST',json:{status:s,remark:r,verified:true}});toast('Status updated and user notified');load()}catch(x){toast(x.message,false)}};
q.oninput=()=>load();uq.oninput=async()=>{const u=await api('/api/admin/users?q='+encodeURIComponent(uq.value));us.innerHTML='<option value="">All users (announcement)</option>'+u.items.map(x=>'<option value="'+x.id+'">'+esc(x.name)+' ('+esc(x.email)+')</option>').join('')};
ms.onclick=async()=>{if(!confirm(us.value?'Send to selected user?':'Send to ALL users?'))return;try{await api('/api/admin/messages',{method:'POST',json:{body:mb.value,user_id:us.value?+us.value:null}});mb.value='';toast('Message sent')}catch(x){toast(x.message,false)}};load()})()</script></body></html>
