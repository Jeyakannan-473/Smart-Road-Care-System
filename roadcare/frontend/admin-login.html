<!doctype html><html lang="en"><head><title>Official sign in - RoadCare</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="/css/roadcare.css" rel="stylesheet"></head><body><div class="auth"><div class="card bg-white">
<h4 class="fw-bold"><i class="bi bi-cone-striped text-success"></i> RoadCare</h4><p class="text-muted">Official sign in</p>
<form id="lf" onsubmit="doLogin(event,'admin')"><label class="form-label" for="email">Email</label><input class="form-control mb-3" id="email" name="email" type="email" required>
<label class="form-label" for="password">Password</label><div class="input-group mb-3"><input class="form-control" id="password" name="password" type="password" required><button type="button" class="btn btn-outline-secondary" onclick="password.type=password.type=='password'?'text':'password'" aria-label="Show password"><i class="bi bi-eye"></i></button></div>
<button class="btn btn-rc w-100">Sign in</button></form><p class="small text-muted mt-3 mb-0">Admin accounts are created by the system administrator only.</p></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/app.js"></script></body></html>
