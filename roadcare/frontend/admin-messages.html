<!doctype html><html lang="en"><head><title>Messages - RoadCare</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="/css/roadcare.css" rel="stylesheet"></head><body><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/app.js"></script><script>
(async()=>{await shell('admin','admin-messages');main.innerHTML=`<h4 class="mb-3">Messages and announcements</h4><div class="row g-3"><div class="col-lg-5"><div class="card p-3"><h6>New message</h6><input id="uq" class="form-control form-control-sm mb-2" placeholder="Search user by name or email" aria-label="Search user"><select id="us" class="form-select form-select-sm mb-2" aria-label="Recipient"><option value="">All users (announcement)</option></select><input id="cid" type="number" class="form-control form-control-sm mb-2" placeholder="Related complaint number (optional)" aria-label="Complaint number"><textarea id="mb" class="form-control mb-2" rows="4" aria-label="Message"></textarea><button class="btn btn-rc btn-sm" id="ms">Send</button></div></div>
<div class="col-lg-7"><div class="card p-3"><div class="d-flex justify-content-between"><h6>Sent messages</h6><input id="sq" class="form-control form-control-sm w-auto" placeholder="Search history" aria-label="Search history"></div><div id="ls" class="small"></div></div></div></div>`;
async function load(){const d=await api('/api/admin/messages?q='+encodeURIComponent(sq.value));ls.innerHTML=d.items.map(m=>`<div class="border-top py-2"><b>To: ${esc(m.to)}</b> <span class="text-muted">${fmt(m.at)}</span><div>${esc(m.body)}</div><div class="text-muted">Read by ${m.read} of ${m.audience}${m.complaint_id?' &middot; complaint #'+m.complaint_id:''}</div></div>`).join('')||'<p class="text-muted mt-2 mb-0">No messages sent yet.</p>'}
uq.oninput=async()=>{const u=await api('/api/admin/users?q='+encodeURIComponent(uq.value));us.innerHTML='<option value="">All users (announcement)</option>'+u.items.map(x=>'<option value="'+x.id+'">'+esc(x.name)+' ('+esc(x.email)+')</option>').join('')};
ms.onclick=async()=>{if(!confirm(us.value?'Send to the selected user?':'Send this announcement to ALL users?'))return;try{await api('/api/admin/messages',{method:'POST',json:{body:mb.value,user_id:us.value?+us.value:null,complaint_id:cid.value?+cid.value:null}});mb.value='';toast('Message sent');load()}catch(e){toast(e.message,false)}};sq.oninput=load;load()})()
</script></body></html>
