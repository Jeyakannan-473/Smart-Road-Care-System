<!doctype html><html lang="en"><head><title>Create account - RoadCare</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="/css/roadcare.css" rel="stylesheet"></head><body><div class="auth"><div class="card bg-white"><h5 class="fw-bold">Create your RoadCare account</h5><form id="f"><label class="form-label" for="n">Full name</label><input class="form-control mb-2" id="n" required><label class="form-label" for="e">Email</label><input class="form-control mb-2" id="e" type="email" required><label class="form-label" for="p">Password</label><input class="form-control mb-3" id="p" type="password" minlength="8" required><button class="btn btn-rc w-100">Register</button></form><a class="small mt-3 d-block" href="/user-login.html">Already registered? Sign in</a></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/app.js"></script><script>f.onsubmit=async x=>{x.preventDefault();try{await api('/api/register',{method:'POST',json:{name:n.value,email:e.value,password:p.value}});toast('Account created');setTimeout(()=>location='/user-login.html',900)}catch(y){toast(y.message,false)}}</script></body></html>
