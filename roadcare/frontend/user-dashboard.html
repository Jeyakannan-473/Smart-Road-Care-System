<!doctype html><html lang="en"><head><title>Dashboard - RoadCare</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="/css/roadcare.css" rel="stylesheet"></head><body><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/app.js"></script>
<script>(async()=>{await shell('user','user-dashboard');const [c,n,m]=await Promise.all([api('/api/complaints'),api('/api/notifications'),api('/api/messages')]);const it=c.items,cnt=s=>it.filter(x=>x.status===s).length;
main.innerHTML=`<h4 class="mb-3">My dashboard</h4><div class="row g-3 mb-4">${[['Submitted',it.length],['Under review',cnt('Under Review')],['In progress',cnt('In Progress')],['Completed',cnt('Completed')]].map(a=>`<div class="col-6 col-md-3"><div class="card stat"><div class="n">${a[1]}</div><div class="l">${a[0]}</div></div></div>`).join('')}</div>
<div class="row g-3"><div class="col-lg-8"><div class="card p-3"><h6>My complaints</h6>${it.length?it.map(x=>`<div class="border-top py-3"><div class="d-flex justify-content-between"><b>${esc(x.public_id)} &middot; ${esc(x.location)}</b>${badge(x.status)}</div><div class="small text-muted">${esc(x.category||'Awaiting assessment')}${x.severity?' &middot; '+esc(x.severity)+' severity':''}${x.needs_review?' &middot; pending admin verification':''} &middot; ${fmt(x.created_at)}</div>${x.remarks?'<div class="small mt-1">Admin remarks: '+esc(x.remarks)+'</div>':''}
<div class="tl mt-2 small">${x.history.map(h=>'<div><b>'+esc(h.to_status)+'</b> <span class="text-muted">'+fmt(h.at)+'</span>'+(h.remark?'<br>'+esc(h.remark):'')+'</div>').join('')}</div></div>`).join(''):'<p class="text-muted mb-0">No complaints yet. <a href="/submit-complaint.html">Report road damage</a>.</p>'}</div></div>
<div class="col-lg-4"><div class="card p-3 mb-3"><h6>Notifications <span class="badge bg-danger">${n.unread||''}</span></h6>${n.items.slice(0,6).map(x=>`<div class="border-top py-2 small ${x.read?'text-muted':''}" role="button" onclick="api('/api/notifications/${x.id}/read',{method:'POST'}).then(()=>this.classList.add('text-muted'))"><b>${esc(x.title)}</b><br>${esc(x.body)}<br><span class="text-muted">${fmt(x.at)}</span></div>`).join('')||'<p class="text-muted small mb-0">Nothing new.</p>'}</div>
<div class="card p-3"><h6>Messages from RoadCare <span class="badge bg-danger">${m.unread||''}</span></h6>${m.items.slice(0,6).map(x=>`<div class="border-top py-2 small ${x.read?'text-muted':''}"><b>${x.announcement?'Announcement':'Maintenance office'}</b><br>${esc(x.body)}<br><span class="text-muted">${fmt(x.at)}</span> ${x.read?'':'<a href="#" onclick="api(\'/api/messages/${x.id}/read\',{method:\'POST\'}).then(()=>location.reload());return false">Mark read</a>'}</div>`).join('')||'<p class="text-muted small mb-0">No messages.</p>'}</div></div></div>`})()</script></body></html>
