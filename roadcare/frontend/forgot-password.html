<!doctype html><html lang="en"><head><title>Reset password - RoadCare</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="/css/roadcare.css" rel="stylesheet"></head><body><div class="auth"><div class="card bg-white"><h5 class="fw-bold">Forgot your password?</h5><p class="text-muted small">Enter your email. If it is registered, the maintenance office will contact you.</p><form id="f"><label class="form-label" for="e">Email</label><input class="form-control mb-3" id="e" type="email" required><button class="btn btn-rc w-100">Continue</button></form><a class="small mt-3 d-block" href="/user-login.html">Back to sign in</a></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/app.js"></script><script>f.onsubmit=async x=>{x.preventDefault();try{const d=await api('/api/forgot',{method:'POST',json:{email:e.value}});toast(d.message)}catch(y){toast(y.message,false)}}</script></body></html>
