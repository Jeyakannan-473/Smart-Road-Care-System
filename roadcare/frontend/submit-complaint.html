<!doctype html><html lang="en"><head><title>Report damage - RoadCare</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="/css/roadcare.css" rel="stylesheet"></head><body><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/app.js"></script>
<script>shell('user','submit-complaint').then(()=>{main.innerHTML=`<h4 class="mb-3">Report road damage</h4><div class="row g-3"><div class="col-lg-7"><form id="cf" class="card p-3"><div class="row g-2">
<div class="col-12"><label class="form-label" for="location">Road location</label><input class="form-control" id="location" name="location" required></div>
<div class="col-md-6"><label class="form-label" for="locality">Locality</label><input class="form-control" id="locality" name="locality" required></div><div class="col-md-6"><label class="form-label" for="city">City</label><input class="form-control" id="city" name="city"></div>
<div class="col-md-6"><label class="form-label" for="road_type">Road type</label><select class="form-select" id="road_type" name="road_type"><option>Residential</option><option>Collector</option><option>Arterial</option><option>Highway</option></select></div>
<div class="col-md-6"><label class="form-label" for="phone">Contact number</label><input class="form-control" id="phone" name="phone"></div>
<div class="col-12"><label class="form-label" for="description">Description</label><textarea class="form-control" id="description" name="description" rows="3"></textarea></div>
<div class="col-12"><label class="form-label" for="image">Photo (JPG or PNG)</label><input class="form-control" id="image" name="image" type="file" accept=".jpg,.jpeg,.png" required></div>
<div class="col-12"><button type="button" class="btn btn-sm btn-outline-secondary" id="gps"><i class="bi bi-geo-alt"></i> Add my GPS location</button> <span class="small text-muted" id="gs"></span></div></div>
<button class="btn btn-rc mt-3" id="sb">Submit and analyse</button></form></div>
<div class="col-lg-5"><div class="card p-3"><div id="pv" class="text-muted small">Image preview appears here.</div><div id="res" class="mt-3"></div></div></div></div>`;
let lat,lng;gps.onclick=()=>navigator.geolocation.getCurrentPosition(p=>{lat=p.coords.latitude;lng=p.coords.longitude;gs.textContent='Location captured'},()=>toast('Location permission denied',false));
image.onchange=()=>{const f=image.files[0];pv.innerHTML=f?'<div id="sc"><img src="'+URL.createObjectURL(f)+'" class="img-fluid rounded" alt="Selected photo preview"></div>':''};
cf.onsubmit=async e=>{e.preventDefault();const fd=new FormData(cf);if(lat){fd.append('lat',lat);fd.append('lng',lng)}sb.disabled=true;
 document.getElementById('sc')?.classList.add('scan');res.innerHTML='<div class="progress" style="height:6px"><div class="progress-bar progress-bar-striped progress-bar-animated bg-success w-100"></div></div><div class="small mt-2 text-muted">Uploading and analysing on the server...</div>';
 try{const d=await api('/api/complaints',{method:'POST',body:fd});show(d.analysis,d.complaint)}catch(x){res.innerHTML='<div class="alert alert-danger">'+esc(x.message)+'</div>'}
 document.getElementById('sc')?.classList.remove('scan');sb.disabled=false};
function show(a,c){const st=a.stages.map(s=>'<li class="list-group-item d-flex justify-content-between"><span><i class="bi bi-'+(s.ok?'check-circle-fill text-success':'exclamation-triangle-fill text-warning')+'"></i> '+esc(s.stage)+(s.note&&s.note!='OK'?' <span class="text-muted small">('+esc(s.note)+')</span>':'')+'</span><span class="text-muted small">'+s.t+'s</span></li>').join('');
 res.innerHTML='<div class="alert alert-success py-2">Complaint <b>'+esc(c.public_id)+'</b> submitted.</div><ul class="list-group mb-2">'+st+'</ul>'+(a.status==='completed'?'<div class="small">Detected: <b>'+esc(a.category)+'</b><br>Estimated severity: <b>'+esc(a.severity)+'</b><br>Confidence: <b>'+Math.round(a.confidence*100)+'%</b><br>Suggested priority: <b>'+esc(c.priority_category)+'</b> ('+c.priority_score+')'+(a.needs_review?'<br><span class="text-warning">Low confidence: flagged for admin verification.</span>':'')+'</div>':'<div class="alert alert-warning small mb-0">Automatic analysis was not available, so this report is marked for manual review.</div>')+'<div class="small text-muted mt-2">Indicative assessment from a photo only; it is not a measurement or engineering safety opinion.</div>'}})</script></body></html>
