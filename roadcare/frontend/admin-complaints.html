<!doctype html><html lang="en"><head><title>Complaints - RoadCare</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="/css/roadcare.css" rel="stylesheet"></head><body><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/app.js"></script><script>
(async()=>{await shell('admin','admin-complaints');let pg=1;main.innerHTML=`<h4 class="mb-3">All complaints</h4><div class="row g-2 mb-3"><div class="col-md-4"><input id="q" class="form-control" placeholder="Search location or locality" aria-label="Search"></div><div class="col-md-3"><select id="st" class="form-select" aria-label="Status"><option value="">All statuses</option>${['Submitted','Under Review','Approved','In Progress','Completed','Rejected'].map(s=>'<option>'+s+'</option>').join('')}</select></div><div class="col-md-3"><select id="sv" class="form-select" aria-label="Severity"><option value="">All severities</option><option>High</option><option>Medium</option><option>Low</option></select></div></div>
<div class="card p-2"><div class="table-responsive"><table class="table align-middle small mb-0"><thead><tr><th>ID</th><th>Location</th><th>Assessment</th><th>Priority</th><th>Status</th><th>Submitted</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></div><div class="d-flex gap-2 mt-3"><button class="btn btn-sm btn-outline-secondary" id="pv">Previous</button><span class="small align-self-center" id="pi"></span><button class="btn btn-sm btn-outline-secondary" id="nx">Next</button></div>`;
async function load(){const d=await api(`/api/admin/complaints?page=${pg}&q=${encodeURIComponent(q.value)}&status=${encodeURIComponent(st.value)}&severity=${encodeURIComponent(sv.value)}`);
 tb.innerHTML=d.items.length?d.items.map(c=>`<tr><td>${esc(c.public_id)}</td><td>${esc(c.location)}<br><span class="text-muted">${esc(c.locality)} &middot; ${esc(c.owner)}</span></td><td>${esc(c.category||'Manual review')}<br><span class="text-muted">${esc(c.severity||'')}${c.needs_review?' &middot; verify':''}</span></td><td>${c.priority_score} ${esc(c.priority_category)}</td><td>${badge(c.status)}</td><td>${fmt(c.created_at)}</td><td><a class="btn btn-sm btn-outline-secondary" href="/complaint-details.html?id=${c.id}">Open</a></td></tr>`).join(''):'<tr><td colspan="7" class="text-center text-muted py-4">No complaints match these filters.</td></tr>';pi.textContent='Page '+pg+' of '+Math.max(d.pages,1);pv.disabled=pg<=1;nx.disabled=pg>=d.pages}
q.oninput=st.onchange=sv.onchange=()=>{pg=1;load()};pv.onclick=()=>{pg--;load()};nx.onclick=()=>{pg++;load()};load()})()
</script></body></html>
