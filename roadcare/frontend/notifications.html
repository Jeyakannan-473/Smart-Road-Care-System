<!doctype html><html lang="en"><head><title>Notifications - RoadCare</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="/css/roadcare.css" rel="stylesheet"></head><body><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/app.js"></script><script>
(async()=>{await shell('user','notifications');main.innerHTML='<div class="d-flex justify-content-between mb-3"><h4>Notifications</h4><button class="btn btn-sm btn-outline-secondary" id="ra">Mark all as read</button></div><div class="card" id="ls"></div>';
async function load(){const d=await api('/api/notifications');ls.innerHTML=d.items.length?d.items.map(n=>`<div class="p-3 border-bottom ${n.read?'text-muted':''}"><div class="d-flex justify-content-between"><b>${esc(n.title)}</b><span class="small">${fmt(n.at)}</span></div><div class="small">${esc(n.body)}</div><div class="small mt-1">${n.complaint_id?'<a href="/complaint-details.html?id='+n.complaint_id+'">View complaint</a>':''} ${n.read?'':'<a href="#" data-id="'+n.id+'" class="ms-2 mr">Mark read</a>'}</div></div>`).join(''):'<div class="p-4 text-center text-muted">You have no notifications.</div>';
 document.querySelectorAll('.mr').forEach(a=>a.onclick=async e=>{e.preventDefault();await api('/api/notifications/'+a.dataset.id+'/read',{method:'POST'});load()})}
ra.onclick=async()=>{await api('/api/notifications/read-all',{method:'POST'});load()};load()})()
</script></body></html>
