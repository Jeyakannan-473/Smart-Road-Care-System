<!doctype html><html lang="en"><head><title>My complaints - RoadCare</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="/css/roadcare.css" rel="stylesheet"></head><body><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/app.js"></script><script>
(async()=>{await shell('user','my-complaints');main.innerHTML=`<h4 class="mb-3">My complaints</h4><div class="row g-2 mb-3"><div class="col-md-5"><input id="q" class="form-control" placeholder="Search by location" aria-label="Search"></div>
<div class="col-md-3"><select id="st" class="form-select" aria-label="Status"><option value="">All statuses</option>${['Submitted','Under Review','Approved','In Progress','Completed','Rejected'].map(s=>'<option>'+s+'</option>').join('')}</select></div>
<div class="col-md-3"><select id="so" class="form-select" aria-label="Sort"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="sev">Severity</option></select></div></div><div class="card p-2"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Photo</th><th>ID / Location</th><th>Damage</th><th>Status</th><th>Submitted</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></div>`;
const R={High:3,Medium:2,Low:1};async function load(){const d=await api('/api/complaints?q='+encodeURIComponent(q.value)+'&status='+encodeURIComponent(st.value));let it=d.items;
 if(so.value==='old')it.reverse();if(so.value==='sev')it.sort((a,b)=>(R[b.severity]||0)-(R[a.severity]||0));
 tb.innerHTML=it.length?it.map(c=>`<tr><td>${c.image?'<img src="'+c.image+'" width="56" height="42" style="object-fit:cover;border-radius:6px" alt="Complaint photo">':'<i class="bi bi-image text-muted"></i>'}</td><td><b>${esc(c.public_id)}</b><br><span class="small text-muted">${esc(c.location)}</span></td><td>${esc(c.category||'Pending assessment')}<br><span class="small text-muted">${esc(c.severity||'')}</span></td><td>${badge(c.status)}${c.remarks?'<div class="small text-muted mt-1">'+esc(c.remarks)+'</div>':''}</td><td class="small">${fmt(c.created_at)}</td><td><a class="btn btn-sm btn-outline-secondary" href="/complaint-details.html?id=${c.id}">View</a></td></tr>`).join(''):'<tr><td colspan="6" class="text-center text-muted py-4">No complaints found. <a href="/submit-complaint.html">Report road damage</a></td></tr>'}
q.oninput=st.onchange=so.onchange=load;load()})()
</script></body></html>
