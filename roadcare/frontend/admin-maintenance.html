<!doctype html><html lang="en"><head><title>Maintenance queue - RoadCare</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="/css/roadcare.css" rel="stylesheet"></head><body><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/app.js"></script><script>
(async()=>{await shell('admin','admin-maintenance');main.innerHTML='<h4 class="mb-1">Maintenance queue</h4><p class="text-muted small">Approved and in-progress work, ordered by the C priority queue: higher score first, then earlier submission.</p><div class="card p-2"><div class="table-responsive"><table class="table align-middle small mb-0"><thead><tr><th>#</th><th>Complaint</th><th>Score</th><th>Contributing factors</th><th>Team</th><th>Status</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></div>';
try{const d=await api('/api/admin/queue');tb.innerHTML=d.items.length?d.items.map(c=>`<tr><td><b>${c.rank}</b></td><td>${esc(c.public_id)}<br><span class="text-muted">${esc(c.location)}, ${esc(c.locality)}</span></td><td>${c.priority_score}<br><span class="text-muted">${esc(c.priority_category)}</span></td><td class="small">${Object.entries(c.breakdown).map(([k,v])=>k+': '+v).join(' &middot; ')}</td><td>${esc(c.team||'Unassigned')}</td><td>${badge(c.status)}</td><td><a class="btn btn-sm btn-outline-secondary" href="/complaint-details.html?id=${c.id}">Manage</a></td></tr>`).join(''):'<tr><td colspan="7" class="text-center text-muted py-4">No approved work is waiting.</td></tr>'}catch(e){tb.innerHTML='<tr><td colspan="7" class="text-danger">'+esc(e.message)+'</td></tr>'}})()
</script></body></html>
