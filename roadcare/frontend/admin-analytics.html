<!doctype html><html lang="en"><head><title>Analytics - RoadCare</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="/css/roadcare.css" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3"></script></head><body><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/app.js"></script><script>
(async()=>{await shell('admin','admin-analytics');const a=await api('/api/admin/analytics');main.innerHTML=`<div class="d-flex justify-content-between mb-3"><h4>Reports and analytics</h4><a class="btn btn-sm btn-rc" href="/api/admin/export.csv"><i class="bi bi-download"></i> Export CSV</a></div><div class="row g-3 mb-3"><div class="col-6 col-md-3"><div class="card stat"><div class="n">${a.pending}</div><div class="l">Pending</div></div></div><div class="col-6 col-md-3"><div class="card stat"><div class="n">${a.completed}</div><div class="l">Completed</div></div></div><div class="col-6 col-md-3"><div class="card stat"><div class="n">${a.avg_resolution_days??'-'}</div><div class="l">Avg. days to resolve</div></div></div></div>
<div class="row g-3"><div class="col-md-6"><div class="card p-3"><h6>Complaints by area</h6><canvas id="c1"></canvas></div></div><div class="col-md-6"><div class="card p-3"><h6>Severity distribution</h6><canvas id="c2"></canvas></div></div><div class="col-md-6"><div class="card p-3"><h6>Completed per month</h6><canvas id="c3"></canvas></div></div>
<div class="col-md-6"><div class="card p-3"><h6>High-priority locations</h6>${a.hot.map(h=>'<div class="border-top py-1 small"><a href="/complaint-details.html?id='+h.id+'">'+esc(h.public_id)+'</a> '+esc(h.location)+', '+esc(h.locality)+' <b class="float-end">'+h.score+'</b></div>').join('')||'<span class="text-muted small">None.</span>'}</div></div></div>`;
const P=['#0B2545','#13315C','#0F9D8A','#9bd3c8','#5B6B80'];new Chart(c1,{type:'bar',data:{labels:Object.keys(a.by_area),datasets:[{data:Object.values(a.by_area),backgroundColor:'#0F9D8A'}]},options:{plugins:{legend:{display:false}}}});new Chart(c2,{type:'doughnut',data:{labels:Object.keys(a.by_severity),datasets:[{data:Object.values(a.by_severity),backgroundColor:P}]}});new Chart(c3,{type:'line',data:{labels:Object.keys(a.monthly_completed),datasets:[{data:Object.values(a.monthly_completed),borderColor:'#0B2545'}]},options:{plugins:{legend:{display:false}}}})})()
</script></body></html>
