<!doctype html><html lang="en"><head><title>Profile - RoadCare</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="/css/roadcare.css" rel="stylesheet"></head><body><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/app.js"></script><script>
(async()=>{await shell('user','profile');const p=await api('/api/profile');main.innerHTML=`<h4 class="mb-3">My profile</h4><div class="row g-3"><div class="col-md-6"><form id="pf" class="card p-3"><label class="form-label" for="n">Name</label><input class="form-control mb-2" id="n" value="${esc(p.name)}" required><label class="form-label">Email</label><input class="form-control mb-2" value="${esc(p.email)}" disabled><label class="form-label" for="ph">Phone</label><input class="form-control mb-3" id="ph" value="${esc(p.phone)}"><button class="btn btn-rc">Save changes</button></form></div>
<div class="col-md-6"><form id="pw" class="card p-3"><h6>Change password</h6><input class="form-control mb-2" id="cu" type="password" placeholder="Current password" aria-label="Current password" required><input class="form-control mb-3" id="nw" type="password" minlength="8" placeholder="New password (8+ characters)" aria-label="New password" required><button class="btn btn-rc">Update password</button></form></div></div>`;
pf.onsubmit=async e=>{e.preventDefault();try{await api('/api/profile',{method:'PUT',json:{name:n.value,phone:ph.value}});toast('Profile saved')}catch(x){toast(x.message,false)}};
pw.onsubmit=async e=>{e.preventDefault();try{await api('/api/password',{method:'POST',json:{current:cu.value,new:nw.value}});toast('Password updated');pw.reset()}catch(x){toast(x.message,false)}}})()
</script></body></html>
