<!doctype html><html lang="en"><head><title>Citizen sign in - RoadCare</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="/css/roadcare.css" rel="stylesheet"></head><body><div class="auth"><div class="card bg-white">
<h4 class="fw-bold"><i class="bi bi-cone-striped text-success"></i> RoadCare</h4><p class="text-muted">Citizen sign in</p>
<form id="lf" onsubmit="doLogin(event,'user')"><label class="form-label" for="email">Email</label><input class="form-control mb-3" id="email" name="email" type="email" required>
<label class="form-label" for="password">Password</label><div class="input-group mb-3"><input class="form-control" id="password" name="password" type="password" required><button type="button" class="btn btn-outline-secondary" onclick="password.type=password.type=='password'?'text':'password'" aria-label="Show password"><i class="bi bi-eye"></i></button></div>
<button class="btn btn-rc w-100">Sign in</button></form><a class="small d-block mt-2" href="/forgot-password.html">Forgot password?</a><hr><h6>New here? Create an account</h6><form id="rf"><input class="form-control mb-2" name="name" placeholder="Full name" aria-label="Full name" required><input class="form-control mb-2" name="email" type="email" placeholder="Email" aria-label="Email" required><input class="form-control mb-2" name="password" type="password" minlength="8" placeholder="Password (8+ characters)" aria-label="Password" required><button class="btn btn-outline-secondary w-100">Register</button></form><script>rf.onsubmit=async e=>{e.preventDefault();const f=e.target;try{await api("/api/register",{method:"POST",json:{name:f.name.value,email:f.email.value,password:f.password.value}});toast("Account created. Please sign in.")}catch(x){toast(x.message,false)}}</script></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/app.js"></script></body></html>
